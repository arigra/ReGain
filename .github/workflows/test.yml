name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ipykernel jupyter_client matplotlib
      - run: npm ci
      - run: npm test
        env:
          REGAIN_PYTHON: python
      - name: setup scripts parse
        shell: pwsh
        working-directory: .
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/setup.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
          if ($IsLinux -or $IsMacOS) { bash -n setup.sh }
